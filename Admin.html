<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Tools — COBOLT</title>
    <link rel="stylesheet" href="css/links.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #444; }
        .grant { background: #2e7d32; }
        .revoke { background: #b71c1c; }
        .ban { background: #6a1b9a; }
        .unban { background: #455a64; }
        #status { margin-top: 15px; font-weight: bold; min-height: 1.2em; }
    </style>
</head>
<body>
<header>
    <h1>Admin Tools</h1>
</header>

<div class="container">
    <div id="auth-section">
        <h2>Admin Sign In</h2>
        <input id="username" placeholder="Username" required/>
        <input id="password" type="password" placeholder="Password" required/>
        <button onclick="signIn()">Sign In</button>
        <div id="auth-message"></div>
    </div>

    <div id="admin-section" style="display:none;">
        <p id="status"></p>
        <table>
            <thead>
            <tr><th>ID</th><th>Username</th><th>Admin?</th><th>Banned?</th><th>Actions</th></tr>
            </thead>
            <tbody id="user-table-body"></tbody>
        </table>
    </div>
</div>

<script src="Scripts/sudotool.js"></script>
</body>
</html>
