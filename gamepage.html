<body>

    <a href="index.html"><img src="Images/aerocoboltbeta.svg" alt="COBOLT Logo" style="height: 50px;"></a>

        <div class="banner_info_area">

        </div>

</div>
<script>
    const API_BASE = "https://cobolt-1-xmcq.gaur-alnilam.ts.net/";
    let authToken = null;
    let currentUsername = null;
    async function signIn() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch(`${API_BASE}/api/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (!response.ok) {
                document.getElementById('auth-message').innerText = data.error || 'Sign in failed.';
                return;
            }

            authToken = data.token;
            currentUsername = data.username;

            document.getElementById('auth-section').style.display = 'none';
            showSection('games');
            loadGames();
            loadPosts();
        } catch (e) {
            document.getElementById('auth-message').innerText = 'Could not reach server: ' + e.message;
        }
    }

    async function signUp() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch(`${API_BASE}/api/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();

            if (!response.ok) {
                document.getElementById('auth-message').innerText = data.error || 'Sign up failed.';
                return;
            }

            document.getElementById('auth-message').innerText = 'Sign up successful. Please sign in.';
        } catch (e) {
            document.getElementById('auth-message').innerText = 'Could not reach server: ' + e.message;
        }
    }

    async function signOut() {
        if (authToken) {
            try {
                await fetch(`${API_BASE}/api/logout`, {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${authToken}` }
                });
            } catch (e) {
            }
        }

        authToken = null;
        currentUsername = null;

        document.getElementById('auth-section').style.display = '';
        document.getElementById('games-section').style.display = 'none';
        document.getElementById('upload-section').style.display = 'none';
        document.getElementById('posts-section').style.display = 'none';
    }


    async function uploadGame(event) {
        event.preventDefault();

        const title = document.getElementById('game-title').value;
        const description = document.getElementById('game-description').value;
        const gameFile = document.getElementById('game-file').files[0];
        const imageFile = document.getElementById('game-image').files[0];

        if (!gameFile) {
            document.getElementById('upload-message').innerText = 'Please choose a game file.';
            return;
        }

        const formData = new FormData();
        formData.append("title", title);
        formData.append("description", description);
        formData.append("game_file", gameFile);
        if (imageFile) {
            formData.append("image_file", imageFile);
        }

        try {
            const response = await fetch(`${API_BASE}/api/games/upload`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${authToken}`
                },
                body: formData
            });
            const data = await response.json();

            if (!response.ok) {
                document.getElementById('upload-message').innerText = data.error || 'Upload failed.';
                return;
            }

            document.getElementById('upload-message').innerText = 'Game uploaded!';
            document.getElementById('game-title').value = '';
            document.getElementById('game-description').value = '';
            loadGames();
        } catch (e) {
            document.getElementById('upload-message').innerText = 'Could not reach server: ' + e.message;
        }
    }

    async function loadGames() {
        const gameList = document.getElementById('game-list');
        gameList.innerHTML = '';

        try {
            const response = await fetch(`${API_BASE}/api/games`);
            const games = await response.json();

            for (const game of games) {
                const card = document.createElement('div');
                card.className = 'game-card';

                const imageTag = game.image_filename
                    ? `<img src="${API_BASE}/api/images/${game.image_filename}" alt="${game.title}">`
                    : '';

                //card.innerHTML = `
                //    ${imageTag}
                //    <img class="capsule-gloss" src="Images/capsulegloss.svg"/>
                //`;
                card.innerHTML = `
                        <div class="game-capsule">
                            ${imageTag}
                            <img class="capsule-gloss" src="Images/capsulegloss.svg"/>
                        </div>
                        <h3>${game.title}</h3>
                        <p>${game.description || ''}</p>
                        <p style="color:#aaa;font-size:0.85em;">by ${game.username}</p>
                        <a href="${API_BASE}/api/games/${game.id}/download" style="color:#8ab4f8;">Download</a>
                    `;
                gameList.appendChild(card);
            }
        } catch (e) {
            gameList.innerText = 'Could not load games: ' + e.message;
        }
    }

    async function createPost(event) {
        event.preventDefault();
        const content = document.getElementById('post-content').value.trim();
        if (!content) return;

        try {
            const response = await fetch(`${API_BASE}/api/posts`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${authToken}`
                },
                body: JSON.stringify({ title: content.slice(0, 50), body: content })
            });
            const data = await response.json();

            if (!response.ok) {
                document.getElementById('post-message').innerText = data.error || 'Post failed.';
                return;
            }

            document.getElementById('post-content').value = '';
            document.getElementById('post-message').innerText = 'Post created!';
            loadPosts();
        } catch (e) {
            document.getElementById('post-message').innerText = 'Could not reach server: ' + e.message;
        }
    }

    async function loadPosts() {
        const postList = document.getElementById('post-list');
        postList.innerHTML = '';

        try {
            const response = await fetch(`${API_BASE}/api/posts`);
            const posts = await response.json();

            for (const post of posts) {
                const div = document.createElement('div');
                div.style.background = '#23272a';
                div.style.margin = '1em 0';
                div.style.padding = '1em';
                div.style.borderRadius = '6px';
                div.innerHTML = `<strong></strong> <span style="color:#aaa;font-size:0.9em;">${new Date(post.created_at).toLocaleString()}</span><br>`;
                div.querySelector('strong').textContent = post.username || 'Anonymous';
                div.append(post.body);
                postList.appendChild(div);
            }
        } catch (e) {
            postList.innerText = 'Could not load posts: ' + e.message;
        }
    }
</script>
