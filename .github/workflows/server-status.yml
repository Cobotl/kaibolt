name: Cobolt Status

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check health endpoint
        id: health
        run: |
          RESPONSE=$(curl -s --max-time 10 https://cobolt-1-xmcq.gaur-alnilam.ts.net/api/health || echo "unreachable")
          echo "response=$RESPONSE" >> "$GITHUB_OUTPUT"

          if echo "$RESPONSE" | grep -q '"status".*"ok"'; then
            echo "message=Up" >> "$GITHUB_OUTPUT"
            echo "color=brightgreen" >> "$GITHUB_OUTPUT"
          else
            echo "message=Down" >> "$GITHUB_OUTPUT"
            echo "color=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Write badge JSON
        run: |
          mkdir -p badges
          cat > badges/status.json << EOF
          {
            "schemaVersion": 1,
            "label": "Server status",
            "message": "${{ steps.health.outputs.message }}",
            "color": "${{ steps.health.outputs.color }}"
          }
          EOF

      - name: Commit badge if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/status.json
          git diff --staged --quiet || git commit -m "Update status badge"
          git push
